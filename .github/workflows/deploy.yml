name: Deploy School Fee Tracker to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check FTP credentials
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          if [ -z "$FTP_SERVER" ] || [ -z "$FTP_USERNAME" ] || [ -z "$FTP_PASSWORD" ]; then
            echo "::error::Configure FTP_SERVER, FTP_USERNAME and FTP_PASSWORD in repository Actions secrets."
            exit 1
          fi

      - name: Verify database deployment secrets
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_DATABASE: ${{ secrets.DB_DATABASE }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          if [ -z "$DB_HOST" ] || [ -z "$DB_PORT" ] || [ -z "$DB_DATABASE" ] || [ -z "$DB_USERNAME" ] || [ -z "$DB_PASSWORD" ]; then
            echo "::error::One or more database secrets are missing (DB_HOST, DB_PORT, DB_DATABASE, DB_USERNAME, DB_PASSWORD)."
            exit 1
          fi
          echo "Database secrets are configured (values not displayed)."
          echo "Note: DB_HOST=localhost refers to Hostinger from the hosted app, not from the GitHub runner."

      - name: Find the website folder on the FTP account
        id: target
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          HOST="${FTP_SERVER#ftp://}"; HOST="${HOST%/}"
          LISTING=$(curl -s --list-only --max-time 30 --user "$FTP_USERNAME:$FTP_PASSWORD" "ftp://$HOST/" || true)
          if [ -z "$LISTING" ] && ! curl -s --list-only --max-time 30 --user "$FTP_USERNAME:$FTP_PASSWORD" "ftp://$HOST/" -o /dev/null; then
            echo "::error::Could not log in to the FTP server to list folders."; exit 1
          fi
          if echo "$LISTING" | tr -d '\r' | grep -qx "public_html"; then DIR="./public_html/"; else DIR="./"; fi
          echo "Deploying into: $DIR"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Deploy over FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftp
          local-dir: ./
          server-dir: ${{ steps.target.outputs.dir }}
          dry-run: false
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/node_modules/**
            **/.env
            **/.env.*
            **/vendor/**
            **/uploads/**
            **/storage/**
            **/backups/**
            **/*.sql
            **/*.zip
