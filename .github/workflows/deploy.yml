name: Deploy School Fee Tracker to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check FTP credentials
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          if [ -z "$FTP_SERVER" ] || [ -z "$FTP_USERNAME" ] || [ -z "$FTP_PASSWORD" ]; then
            echo "::error::Configure FTP_SERVER, FTP_USERNAME and FTP_PASSWORD in repository Actions secrets."
            exit 1
          fi

      - name: Verify database deployment secrets
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_DATABASE: ${{ secrets.DB_DATABASE }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          if [ -z "$DB_HOST" ] || [ -z "$DB_PORT" ] || [ -z "$DB_DATABASE" ] || [ -z "$DB_USERNAME" ] || [ -z "$DB_PASSWORD" ]; then
            echo "::error::One or more database secrets are missing (DB_HOST, DB_PORT, DB_DATABASE, DB_USERNAME, DB_PASSWORD)."
            exit 1
          fi
          echo "Database secrets are configured (values not displayed)."
          echo "Note: DB_HOST=localhost refers to Hostinger from the hosted app, not from the GitHub runner."

      - name: Deploy over FTP (uploads only; never deletes school data)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          # The FTP login of this Hostinger account opens directly in the website folder (public_html).
          TARGET_DIR: ./
        run: |
          sudo apt-get -qq update >/dev/null && sudo apt-get -qq install -y lftp >/dev/null
          HOST="${FTP_SERVER#ftp://}"; HOST="${HOST%/}"
          # Excludes: same as before – server-side data and secrets are never uploaded or overwritten.
          lftp -u "$FTP_USERNAME,$FTP_PASSWORD" -p 21 "$HOST" <<LFTP
          set ftp:ssl-allow yes
          set ssl:verify-certificate no
          set ftp:passive-mode yes
          set net:max-retries 5
          set net:reconnect-interval-base 5
          set net:timeout 30
          set cmd:fail-exit no
          # One-time clean-up: an earlier run uploaded a copy of this app into a nested public_html/ folder.
          # Remove it only if it is that copy (it contains this app's inc/config_loader.php).
          cls -1 public_html/inc/config_loader.php && rm -r public_html
          set cmd:fail-exit yes
          mirror --reverse --verbose --parallel=2 --no-perms \
            --exclude-glob .git* --exclude-glob .git*/ --exclude-glob .github/ \
            --exclude-glob node_modules/ --exclude-glob .env --exclude-glob .env.* \
            --exclude-glob vendor/ --exclude-glob uploads/ --exclude-glob storage/ --exclude-glob backups/ \
            --exclude-glob *.sql --exclude-glob *.zip \
            ./ "$TARGET_DIR"
          bye
          LFTP
          echo "Deploy finished into $TARGET_DIR"
